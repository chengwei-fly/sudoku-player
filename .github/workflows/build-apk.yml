name: Build Android APK

on:
  # 推送到 master 分支时自动构建
  push:
    branches:
      - master
  # 手动触发（保留备用）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch android/build.gradle (downgrade AGP)
        run: |
          cat > android/build.gradle << 'EOF'
          // Top-level build file
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.7.2'
                  classpath 'com.google.gms:google-services:4.4.2'
              }
          }
          apply from: "variables.gradle"
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF
          echo "=== android/build.gradle patched ==="
          cat android/build.gradle

      - name: Patch android/variables.gradle (compileSdk 35)
        run: |
          cat > android/variables.gradle << 'EOF'
          ext {
              minSdkVersion = 24
              compileSdkVersion = 35
              targetSdkVersion = 35
              androidxActivityVersion = '1.8.0'
              androidxAppCompatVersion = '1.6.1'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.12.0'
              androidxFragmentVersion = '1.6.2'
              coreSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.9.0'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.1.5'
              androidxEspressoCoreVersion = '3.5.1'
              cordovaAndroidVersion = '14.0.1'
          }
          EOF
          echo "=== android/variables.gradle patched ==="
          cat android/variables.gradle

      - name: Patch gradle-wrapper.properties
        run: |
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          echo "=== gradle-wrapper.properties patched ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK (cmdline-tools)
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12.0'
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Debug environment
        run: |
          echo "=== Environment ==="
          pwd
          node -v
          npm -v
          java -version 2>&1
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME/platforms/ 2>&1 || echo "no platforms"
          ls -la $ANDROID_HOME/build-tools/ 2>&1 || echo "no build-tools"
          echo "=== End environment ==="

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses 2>&1 || true
          echo "Licenses accepted"

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          echo "Install done"

      - name: Build web
        env:
          GITHUB_PAGES: "true"
        run: |
          npm run build
          echo "Build done"
          ls -la dist/

      - name: Cap sync
        run: |
          npx cap sync android
          echo "Cap sync done"
          ls -la android/

      - name: Gradle wrapper
        run: |
          chmod +x android/gradlew
          ls -la android/gradlew

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          EXIT=${PIPESTATUS[0]}
          echo "===== Gradle exit code: $EXIT ====="
          if [ $EXIT -ne 0 ]; then
            echo "===== FAILURE / Error summary ====="
            grep -E "FAILURE|What went wrong|error:|Could not|>|Caused by:" /tmp/gradle.log | head -60 || echo "(no matching lines)"
            echo "===== Build outputs ====="
            find . -name "*.apk" 2>/dev/null || echo "no apk"
          fi
          exit $EXIT

      - name: Verify APK
        id: verify
        run: |
          APK_PATH=$(find android -name "app-debug.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "✓ APK found at: $APK_PATH"
            ls -la "$APK_PATH"
          else
            echo "✗ APK not found anywhere"
            find android -name "*.apk" 2>&1 || true
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.verify.outputs.apk_path }}
          if-no-files-found: error
