<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
  <!-- 圆角背景 -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- 9 宫格线 -->
  <g stroke="white" stroke-width="6" fill="none" opacity="0.95">
    <!-- 外框 -->
    <rect x="64" y="64" width="384" height="384" rx="8" ry="8"/>
    <!-- 内部网格线（更粗的 3x3 分隔）-->
    <line x1="192" y1="64" x2="192" y2="448" stroke-width="10"/>
    <line x1="320" y1="64" x2="320" y2="448" stroke-width="10"/>
    <line x1="64" y1="192" x2="448" y2="192" stroke-width="10"/>
    <line x1="64" y1="320" x2="448" y2="320" stroke-width="10"/>
    <!-- 细线 -->
    <line x1="128" y1="64" x2="128" y2="448" stroke-width="4"/>
    <line x1="256" y1="64" x2="256" y2="448" stroke-width="4"/>
    <line x1="384" y1="64" x2="384" y2="448" stroke-width="4"/>
    <line x1="64" y1="128" x2="448" y2="128" stroke-width="4"/>
    <line x1="64" y1="256" x2="448" y2="256" stroke-width="4"/>
    <line x1="64" y1="384" x2="448" y2="384" stroke-width="4"/>
  </g>
  <!-- 示例数字（白色加粗） -->
  <g fill="white" font-family="Arial, sans-serif" font-weight="900" text-anchor="middle">
    <text x="96" y="115" font-size="56">5</text>
    <text x="160" y="115" font-size="56">3</text>
    <text x="288" y="115" font-size="56">7</text>
    <text x="416" y="115" font-size="56">2</text>
    <text x="96" y="243" font-size="56">6</text>
    <text x="224" y="243" font-size="56">1</text>
    <text x="352" y="243" font-size="56">9</text>
    <text x="160" y="371" font-size="56">9</text>
    <text x="288" y="371" font-size="56">8</text>
    <text x="416" y="371" font-size="56">3</text>
    <text x="96" y="435" font-size="56">2</text>
    <text x="224" y="435" font-size="56">5</text>
    <text x="352" y="435" font-size="56">6</text>
  </g>
</svg>
